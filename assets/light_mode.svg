<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">

    <!-- Background -->
    <rect width="1200" height="650" rx="20" fill="#ffffff"></rect>

    <!-- Outer Border -->
    <rect x="5" y="5" width="1190" height="640" rx="20" fill="none" stroke="#d0d7de" stroke-width="2"></rect>

    <!-- Terminal Header -->
