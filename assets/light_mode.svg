<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">

    <!-- Background -->
    <rect width="1200" height="650" rx="20" fill="#ffffff"></rect>

    <!-- Outer Border -->
    <rect x="5" y="5" width="1190" height="640" rx="20" fill="none" stroke="#d0d7de" stroke-width="2"></rect>

    <!-- Terminal Header -->
    <rect x="5" y="5" width="1190" height="45" rx="20" fill="#f6f8fa"></rect>

    <!-- Fix bottom corners -->
    <rect x="5" y="30" width="1190" height="20" fill="#f6f8fa"></rect>

    <!-- Terminal Buttons -->
    <circle cx="35" cy="27" r="7" fill="#ff5f56"></circle>
    <circle cx="60" cy="27" r="7" fill="#ffbd2e"></circle>
    <circle cx="85" cy="27" r="7" fill="#27c93f"></circle>

    <!-- Terminal Title -->
    <text x="950" y="32" font-size="18" font-family="Cascadia Code, monospace" fill="#57606a">

        ~/home/bijit1234/profile
    </text>
<!-- Left Panel -->
<rect
    x="30"
    y="70"
    width="500"
    height="540"
    rx="12"
    fill="#ffffff"
    stroke="#d0d7de"
    stroke-width="1.5"/>

<!-- Right Panel -->
<rect
    x="560"
    y="70"
    width="610"
    height="540"
    rx="12"
    fill="#ffffff"
    stroke="#d0d7de"
    stroke-width="1.5"/>

<!-- Username -->
<text
    x="600"
    y="120"
    font-family="Cascadia Code, Consolas, monospace"
    font-size="34"
    font-weight="700"
    fill="#24292f">

    bijit1234
</text>

<!-- Divider -->
<line
    x1="600"
    y1="145"
    x2="1120"
    y2="145"
    stroke="#0969DA"
    stroke-width="2"/>

<!-- Quote -->
<text
    x="600"
    y="180"
    font-family="Cascadia Code, Consolas, monospace"
    font-size="18"
    fill="#57606A">

    &gt; Building cool things, one commit at a time.
</text>   

